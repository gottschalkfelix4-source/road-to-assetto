services:
  roadtoassetto:
    build:
      context: .
    image: ghcr.io/gottschalkfelix4-source/road-to-assetto:latest
    platform: linux/amd64
    init: true
    restart: unless-stopped
    ports:
      - "${ROADTOASSETTO_BIND_IP:-127.0.0.1}:${ROADTOASSETTO_PORT:-8766}:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - roadtoassetto-data:/data
    environment:
      ROADTOASSETTO_DATA_DIR: /data
      ROADTOASSETTO_SECURE_COOKIE: ${ROADTOASSETTO_SECURE_COOKIE:-0}
      ROADTOASSETTO_OSM_MODE: ${ROADTOASSETTO_OSM_MODE:-auto}
      ROADTOASSETTO_GEOCODER_URL: ${ROADTOASSETTO_GEOCODER_URL:-https://nominatim.openstreetmap.org}
      ROADTOASSETTO_OVERPASS_URL: ${ROADTOASSETTO_OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      ROADTOASSETTO_ROUTER_URL: ${ROADTOASSETTO_ROUTER_URL:-https://router.project-osrm.org}
      ROADTOASSETTO_ROUTER_PROFILE: ${ROADTOASSETTO_ROUTER_PROFILE:-driving}
      ROADTOASSETTO_ROUTER_EXCLUDE: ${ROADTOASSETTO_ROUTER_EXCLUDE:-}
      ROADTOASSETTO_TILE_URL: ${ROADTOASSETTO_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      ROADTOASSETTO_TILE_ATTRIBUTION: ${ROADTOASSETTO_TILE_ATTRIBUTION:-}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 8g
    cpus: 4.0
    stop_grace_period: 40s

volumes:
  roadtoassetto-data:
